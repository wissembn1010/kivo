name: Validate onboarding fix bccd13d
on:
  push:
    branches: [validation/onboarding-language-bccd13d]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8
        ports: ['3306:3306']
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact patch to isolated checkout
        run: |
          git worktree add --detach "$RUNNER_TEMP/creditflow" 5782e64eecc4cf10cae8ccb6c47b960dbc364bc0
          git diff --binary 5782e64eecc4cf10cae8ccb6c47b960dbc364bc0 bccd13d6ad061ebf7d2ff85a9d1af64989b4a9b6 > "$RUNNER_TEMP/fix.patch"
          cd "$RUNNER_TEMP/creditflow"
          git apply --index "$RUNNER_TEMP/fix.patch"
          test "$(git write-tree)" = 8c4c0c06c529abedb47bc6a34f2a183c28d95546
          git diff --cached --stat
      - name: Provision temporary Frappe bench
        id: provision
        run: |
          docker run -d --name kivo-test --network host --entrypoint sleep -v "$RUNNER_TEMP/creditflow:/input:ro" -v "$GITHUB_WORKSPACE/.validation:/validation:ro" frappe/erpnext:v16.60.0 infinity
          docker exec kivo-test bash -ec '
            cd /home/frappe/frappe-bench
            cp -R /input apps/creditflow
            bench pip install -e apps/creditflow
            ls -1 apps > sites/apps.txt
            for config in redis_cache redis_queue redis_socketio; do bench set-config -g "$config" redis://127.0.0.1:6379; done
            bench new-site test_kivo.localhost --db-host 127.0.0.1 --mariadb-user-host-login-scope=% --db-root-password disposable-ci --admin-password disposable-ci --install-app creditflow
            bench --site test_kivo.localhost set-config allow_tests true --parse
            bench version'
      - name: Python and Jinja regression suite
        run: docker exec kivo-test env/bin/python -m unittest -v creditflow.tests.test_website_language_selector
      - name: Existing onboarding, localization and navigation suites
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          result=0
          for module in test_onboarding_website test_localization test_language_navigation; do
            docker exec kivo-test bench --site test_kivo.localhost run-tests --app creditflow --module "creditflow.tests.$module" || result=1
          done
          exit "$result"
      - name: Real sandbox and authenticated HTTP checks
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: docker exec kivo-test env/bin/python /validation/onboarding_http.py
