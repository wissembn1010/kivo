name: Validate onboarding fix bccd13d
on:
  push:
    branches: [validation/onboarding-language-bccd13d]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8
        ports: ['3306:3306']
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact patch to isolated checkout
        run: |
          git worktree add --detach "$RUNNER_TEMP/creditflow" 5782e64eecc4cf10cae8ccb6c47b960dbc364bc0
          git diff --binary 5782e64eecc4cf10cae8ccb6c47b960dbc364bc0 dcbbcfb9419a829533865735516f0565ef3205bd > "$RUNNER_TEMP/fix.patch"
          cd "$RUNNER_TEMP/creditflow"
          git apply --index "$RUNNER_TEMP/fix.patch"
          test "$(git write-tree)" = a09639fa073277c3258ad2baf5a70469d2dcd8b5
          git diff --cached --stat
      - name: Provision temporary Frappe bench
        id: provision
        run: |
          docker run -d --name kivo-test --network host -v "$RUNNER_TEMP/creditflow:/input:ro" -v "$GITHUB_WORKSPACE/.validation:/validation:ro" frappe/erpnext:v16.60.0 sleep infinity
          docker exec kivo-test bash -ec '
            cd /home/frappe/frappe-bench
            cp -R /input apps/creditflow
            bench pip install -e apps/creditflow
            ln -s "$PWD/apps/creditflow/creditflow/public" sites/assets/creditflow
            ls -1 apps > sites/apps.txt
            for config in redis_cache redis_queue redis_socketio; do bench set-config -g "$config" redis://127.0.0.1:6379; done
            bench new-site test_kivo.localhost --db-host 127.0.0.1 --mariadb-user-host-login-scope=% --db-root-password disposable-ci --admin-password disposable-ci --install-app creditflow
            bench --site test_kivo.localhost set-config allow_tests 1 --parse
            bench version'
      - name: Python and Jinja regression suite
        run: docker exec kivo-test env/bin/python -m unittest -v creditflow.tests.test_website_language_selector
      - name: Existing onboarding, localization and navigation suites
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          result=0
          for module in test_onboarding_website test_localization test_language_navigation; do
            docker exec kivo-test bench --site test_kivo.localhost run-tests --app creditflow --module "creditflow.tests.$module" || result=1
          done
          exit "$result"
      - name: Real sandbox and authenticated HTTP checks
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: docker exec kivo-test env/bin/python /validation/onboarding_http.py
      - name: Switch languages with the actual selector in Chrome
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          chromedriver --port=9515 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:9515/status
          docker exec -e BROWSER_CONTROL=1 kivo-test env/bin/python /validation/onboarding_http.py
      - name: Reproduce missing hook on original revision
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/old-creditflow" 5782e64eecc4cf10cae8ccb6c47b960dbc364bc0
          docker cp "$RUNNER_TEMP/old-creditflow/creditflow/." kivo-test:/home/frappe/frappe-bench/apps/creditflow/creditflow
          docker exec kivo-test bench --site test_kivo.localhost clear-cache
          docker exec -e BASELINE_CONTROL=1 kivo-test env/bin/python /validation/onboarding_http.py
